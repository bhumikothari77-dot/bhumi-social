<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhumi Social</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <h1>Bhumi Social 🌸</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <section class="welcome">
            <h2>Welcome to Bhumi Social 💗</h2>
            <p>Connect, share and stay connected.</p>
        </section>

        <!-- Create Post -->
        <section class="create-post">
            <h3>Create a Post ✍️</h3>

            <textarea
                id="postText"
                placeholder="What's on your mind?"
            ></textarea>

            <button onclick="createPost()">Post</button>
        </section>

        <!-- Home Feed -->
        <section class="feed">

            <h3>Home Feed 🏠</h3>

            <div id="posts">

                <article class="post">
                    <h4>Bhumi 🌸</h4>
                    <p>Welcome to my new social media project! 🚀</p>

                    <button>❤️ Like</button>
                    <button>💬 Comment</button>
                </article>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Bhumi Social | Built with ❤️ and DevOps</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
